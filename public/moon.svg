<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-label="Full moon">
  <!--
    The near side of the Moon, drawn from the full-phase reference.
    Three things carry the likeness, and the first version missed all three:

    1. The maria are CONNECTED, not spotted. Imbrium runs into Procellarum down
       the western limb; Serenitatis, Tranquillitatis, Fecunditatis and Nectaris
       form one chain down the east. Separate circles read as a golf ball.
    2. Their edges are IRREGULAR. Coastlines are what the eye recognises, so
       these are paths, not ellipses, and the blur is light enough to keep them.
    3. Contrast is HIGH. In the photograph the maria are near-charcoal against
       pale highlands, not a grey tint.

    North up, as seen from Earth. Positions are approximate but correct relative
    to each other, which is what recognition actually depends on.
  -->
  <defs>
    <!-- Full phase: the Sun is behind the observer, so there is no terminator
         and almost no shading. A bright, nearly flat disc - an offset hotspot
         here would be crescent lighting. -->
    <radialGradient id="body" cx="48%" cy="45%" r="72%">
      <stop offset="0%"   stop-color="#f7f7f6"/>
      <stop offset="62%"  stop-color="#ebebe9"/>
      <stop offset="86%"  stop-color="#d9d9d6"/>
      <stop offset="100%" stop-color="#bcbcba"/>
    </radialGradient>

    <radialGradient id="limb" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#000" stop-opacity="0"/>
      <stop offset="82%"  stop-color="#000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#14141c" stop-opacity="0.32"/>
    </radialGradient>

    <!-- Light. Enough to soften a hard vector edge, not enough to lose the
         coastline that does the recognising. -->
    <filter id="coast" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.1"/>
    </filter>
    <filter id="dust" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.4"/>
    </filter>
    <filter id="ray" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="1.6"/>
    </filter>

    <clipPath id="disc"><circle cx="100" cy="100" r="98"/></clipPath>
  </defs>

  <circle cx="100" cy="100" r="98" fill="url(#body)"/>

  <g clip-path="url(#disc)">
    <!-- WESTERN COMPLEX: Imbrium spilling south into Oceanus Procellarum,
         which runs down the western limb. One landmass, not two spots. -->
    <g fill="#4a4f5c" filter="url(#coast)">
      <!-- Imbrium and Procellarum as ONE coastline, lobed and concave the way
           a real basin rim is. Two tidy ovals read as spots however dark they
           get; the bays and peninsulas are the recognisable part. -->
      <path opacity="0.7" d="M46 34 C66 24, 92 30, 97 48 C101 62, 92 74, 78 79
        C86 88, 84 104, 74 116 C66 126, 68 140, 58 150 C46 162, 26 158, 18 144
        C8 126, 12 100, 24 84 C31 74, 40 72, 44 66 C36 62, 30 54, 32 46
        C34 38, 40 36, 46 34 Z"/>
      <!-- Mare Frigoris: broken into two faint segments and pulled toward the
           limb. As one solid arc it floated in the highlands like a cigar,
           which is the sort of shape that gives a drawing away. -->
      <path opacity="0.3" d="M58 26 C74 18, 92 17, 104 21 C94 26, 80 27, 68 28 C63 28, 60 27, 58 26 Z"/>
      <path opacity="0.26" d="M112 20 C124 17, 136 19, 143 24 C133 27, 120 25, 112 24 Z"/>
      <!-- Nubium and Humorum, south, small and separate -->
      <path opacity="0.5" d="M78 126 C90 122, 101 130, 98 141 C95 152, 82 154, 74 146
        C68 139, 70 129, 78 126 Z"/>
      <path opacity="0.5" d="M54 134 C63 131, 69 138, 66 147 C63 155, 54 156, 49 149
        C45 143, 48 136, 54 134 Z"/>
    </g>

    <!-- EASTERN CHAIN: Serenitatis into Tranquillitatis into Fecunditatis and
         Nectaris - the connected run down the east the photo makes obvious. -->
    <g fill="#464b58" filter="url(#coast)">
      <!-- Serenitatis -> Tranquillitatis -> Fecunditatis -> Nectaris as one
           continuous run, which is what the photograph actually shows. -->
      <path opacity="0.74" d="M106 42 C124 34, 141 42, 142 57 C143 68, 136 76, 126 79
        C136 86, 141 98, 137 110 C147 110, 158 118, 157 131 C156 145, 143 151, 133 144
        C124 138, 124 128, 127 121 C117 124, 106 118, 103 107 C100 96, 106 87, 114 83
        C104 80, 98 71, 100 60 C101 51, 103 46, 106 42 Z"/>
      <!-- Mare Crisium, alone by the eastern limb. The giveaway feature. -->
      <path opacity="0.78" d="M161 55 C173 51, 183 60, 182 71 C181 83, 168 89, 160 83
        C151 76, 152 59, 161 55 Z"/>
      <path opacity="0.44" d="M98 84 C105 82, 110 86, 108 92 C106 98, 98 98, 95 93
        C93 88, 95 85, 98 84 Z"/>
    </g>

    <!-- TYCHO. The ray system is the most recognisable thing on a full moon -
         long, bright, reaching most of the way across the disc. -->
    <g stroke="#fbfcfd" stroke-linecap="round" filter="url(#ray)" opacity="0.55">
      <path d="M88 156 L52 198" stroke-width="2.6"/>
      <path d="M88 156 L112 200" stroke-width="2.3"/>
      <path d="M88 156 L28 182" stroke-width="2.2"/>
      <path d="M88 156 L152 190" stroke-width="1.9"/>
      <path d="M88 156 L66 96"  stroke-width="2"/>
      <path d="M88 156 L124 104" stroke-width="1.8"/>
      <path d="M88 156 L16 132" stroke-width="1.7"/>
      <path d="M88 156 L172 142" stroke-width="1.6"/>
      <path d="M88 156 L100 92" stroke-width="1.4"/>
    </g>
    <circle cx="88" cy="156" r="5" fill="#fdfdfe" opacity="0.9"/>
    <circle cx="88" cy="156" r="2.2" fill="#9aa0ad" opacity="0.55"/>

    <circle cx="78" cy="98" r="7" fill="#f6f8fa" opacity="0.45" filter="url(#ray)"/>
    <circle cx="78" cy="98" r="2.8" fill="#fdfdfe" opacity="0.8"/>
    <circle cx="54" cy="86" r="4" fill="#f2f5f8" opacity="0.4" filter="url(#ray)"/>

    <g fill="#9fa4b0" opacity="0.26" filter="url(#dust)">
      <circle cx="122" cy="158" r="10"/>
      <circle cx="150" cy="42" r="8"/>
      <circle cx="40" cy="48" r="7"/>
      <circle cx="168" cy="108" r="6"/>
      <circle cx="102" cy="182" r="8"/>
      <circle cx="26" cy="116" r="6"/>
      <circle cx="64" cy="176" r="7"/>
    </g>

    <circle cx="100" cy="100" r="98" fill="url(#limb)"/>
  </g>
</svg>
