name: Featherless LLM proxy
description: >
  Starts a LiteLLM proxy on the runner that speaks the Anthropic Messages API
  and forwards to Featherless, then exports ANTHROPIC_BASE_URL/ANTHROPIC_API_KEY
  so claude-code-action talks to it instead of api.anthropic.com.

inputs:
  featherless_api_key:
    description: Featherless API key
    required: true
  port:
    description: Port to bind the proxy to on the runner
    required: false
    default: "4000"
  max_output_tokens:
    description: >
      Cap for Claude Code's requested max_tokens. Must stay at or below the
      upstream model's ceiling (Featherless allows 32768 for Kimi-K3).
    required: false
    default: "32000"

runs:
  using: composite
  steps:
    - name: Install LiteLLM
      shell: bash
      # litellm 1.97.0's proxy imports get_flat_dependant from
      # fastapi.dependencies.utils. fastapi removed that symbol in 0.140.0,
      # and litellm's [proxy] extra only says fastapi>=0.136.3,<1.0 — so a
      # clean resolve picks 0.141 and the proxy dies on import before it ever
      # binds a port. <0.140 is the upper half of that gap; >=0.136.3 comes
      # from litellm itself. Verified working end to end on 0.139.2.
      #
      # Not --quiet: if the resolve ever fails, the conflict tree is the only
      # thing that explains why, and --quiet throws it away.
      run: pip install "litellm[proxy]==1.97.0" "fastapi<0.140"

    - name: Start proxy and wait for it to answer
      shell: bash
      env:
        FEATHERLESS_API_KEY: ${{ inputs.featherless_api_key }}
      run: |
        set -euo pipefail
        # A random per-job master key. The proxy is bound to loopback only, but
        # this keeps it from accepting requests from anything else on the runner.
        PROXY_MASTER_KEY="sk-proxy-$(head -c 24 /dev/urandom | base64 | tr -dc 'a-zA-Z0-9')"
        export PROXY_MASTER_KEY

        litellm --config .github/litellm.config.yaml \
                --host 127.0.0.1 --port ${{ inputs.port }} \
                > /tmp/litellm.log 2>&1 &
        echo $! > /tmp/litellm.pid

        # Fail fast and loudly. A proxy that never comes up would otherwise
        # surface as an opaque connection error from deep inside the agent.
        for i in $(seq 1 60); do
          if curl -sf "http://127.0.0.1:${{ inputs.port }}/health/liveliness" >/dev/null 2>&1; then
            echo "proxy up after ${i}s"
            echo "ANTHROPIC_BASE_URL=http://127.0.0.1:${{ inputs.port }}" >> "$GITHUB_ENV"
            echo "ANTHROPIC_API_KEY=${PROXY_MASTER_KEY}" >> "$GITHUB_ENV"
            # Claude Code sizes max_tokens for Claude's output limit and asks
            # for 64000. Featherless caps Kimi-K3 at 32768 and rejects the
            # whole request:
            #   max_tokens_exceeded - The requested 'max_tokens' of 64000
            #   exceeds the maximum allowed for this model, which is 32768.
            # Every agent call 400s on turn 1. Cap it below the ceiling.
            echo "CLAUDE_CODE_MAX_OUTPUT_TOKENS=${{ inputs.max_output_tokens }}" >> "$GITHUB_ENV"
            echo "::add-mask::${PROXY_MASTER_KEY}"
            exit 0
          fi
          sleep 1
        done

        echo "::error::LiteLLM proxy did not become healthy within 60s"
        cat /tmp/litellm.log
        exit 1
