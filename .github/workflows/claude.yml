name: Claude

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  claude:
    if: contains(github.event.comment.body, '@claude')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - name: Start the Featherless->Anthropic proxy
        uses: ./.github/actions/llm-proxy
        with:
          featherless_api_key: ${{ secrets.FEATHERLESS_API_KEY }}

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ env.ANTHROPIC_API_KEY }}
          claude_args: '--allowedTools "Bash,Read,Edit,Write,Glob,Grep,TodoWrite"'
