name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.pw-browsers
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Radar pipeline tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Assert three.js is not on the entry critical path
        # Regression guard for the manualChunks fix: if react ever gets merged
        # back into the three chunk, the 850KB bundle becomes a blocking
        # dependency of every route again and this fails loudly.
        run: |
          if grep -q 'modulepreload[^>]*three-' dist/index.html; then
            echo "::error::three.js is modulepreloaded from the entry — check build.rollupOptions.output.manualChunks"
            exit 1
          fi
          echo "OK: three.js is lazy-loaded"

      - name: Assert the service worker cache version was stamped
        run: |
          if grep -q '__BUILD_ID__' dist/sw.js; then
            echo "::error::dist/sw.js still contains __BUILD_ID__ — scripts/stamp-sw.mjs did not run"
            exit 1
          fi
          echo "OK: $(grep 'const CACHE' dist/sw.js)"

      - name: Install Chromium for the smoke test
        run: npx playwright install --with-deps chromium

      - name: Smoke test every route in a real browser
        run: npm run smoke
